[package]
name = "broken_nest"
version = "0.2.0"
edition = "2024"
description = "LV2 plugin chain host — direct lilv/suil/JACK hosting"

[lib]
name = "broken_nest"
path = "src/lib.rs"

[features]
default = ["ui"]
ui = []

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
log = "0.4"
jack = "0.13"
rtrb = "0.3"
lilv = "0.2"
lv2_raw = "0.2"

[build-dependencies]
pkg-config = "0.3"
cc = "1"

[dev-dependencies]
tempfile = "3"
env_logger = "0.11"
